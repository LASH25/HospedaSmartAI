# Cuando haya un proxy HTTPS delante (Caddy), descomenta y ajusta para ver la IP real del huésped:
# set_real_ip_from 172.16.0.0/12;
# real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=api_pub:10m rate=10r/s;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~ ^/(webhook|webhook-test)/077fbf66-1af2-40cd-98f6-03f504473e56/webhook$ {
    limit_except POST { deny all; }
    set $bot hospedasmart-n8n:5678;
    proxy_pass http://$bot;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
  }

  location /api/publico/ {
    limit_req zone=api_pub burst=20 nodelay;
    set $u publico-service:3010;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
