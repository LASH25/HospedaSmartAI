server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver de Docker: permite arrancar aunque algun servicio aun no este arriba
  resolver 127.0.0.11 valid=10s ipv6=off;

  # El navegador llama a /api/<ruta>; nginx quita "/api" y lo manda al servicio.
  location ~ ^/api/reservas(/|$) {
    set $u reservas-service:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location ~ ^/api/(habitaciones|solicitudes-habitacion)(/|$) {
    set $u habitaciones-service:3002;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location ~ ^/api/huespedes(/|$) {
    set $u huespedes-service:3003;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location ~ ^/api/cuentas(/|$) {
    set $u cobros-service:3006;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location ~ ^/api/(auth|usuarios)(/|$) {
    set $u usuarios-service:3004;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location ~ ^/api/(asistente|conocimientos)(/|$) {
    set $u asistente-service:3005;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$u;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
