name: hospedasmart-stack
services:
  mysql-stack:
    ports:
      - "127.0.0.1:3307:3306"
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      MYSQL_ROOT_HOST: '%'
    volumes:
    - stack_mysql_data:/var/lib/mysql
    - ./backend/infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
  reservas-service:
    build:
      context: ./backend/reservas-service
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql-stack
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      DB_NAME: hs_reservas
      PORT: '3001'
      HABITACIONES_SERVICE_URL: http://habitaciones-service:3002
      HUESPEDES_SERVICE_URL: http://huespedes-service:3003
      SERVICE_NAME: reservas
      USUARIOS_SERVICE_URL: http://usuarios-service:3004
      INTERNAL_READERS: '{"cobros": "${COBROS_INTERNAL_TOKEN:?Genera seguridad.env}"}'
      INTERNAL_SERVICE_NAME: reservas
      INTERNAL_SERVICE_TOKEN: ${RESERVAS_INTERNAL_TOKEN:?Genera seguridad.env}
      COBROS_SERVICE_URL: http://cobros-service:3006
      HOTEL_TIMEZONE: America/Mexico_City
      N8N_ENCUESTA_WEBHOOK_URL: http://hospedasmart-n8n:5678/webhook/encuesta-checkout-hotel5letras
      ENCUESTA_PUBLIC_URL: ${PUBLIC_ORIGIN:?Configura PUBLIC_ORIGIN en publico.env}

    ports:
    - 127.0.0.1:3001:3001
    depends_on:
      mysql-stack:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
  habitaciones-service:
    build:
      context: ./backend/habitaciones-service
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql-stack
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      DB_NAME: hs_habitaciones
      PORT: '3002'
      SERVICE_NAME: habitaciones
      USUARIOS_SERVICE_URL: http://usuarios-service:3004
      INTERNAL_READERS: '{"reservas": "${RESERVAS_INTERNAL_TOKEN:?Genera seguridad.env}"}'
    ports:
    - 127.0.0.1:3002:3002
    depends_on:
      mysql-stack:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3002/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
  usuarios-service:
    build:
      context: ./backend/usuarios-service
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql-stack
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      DB_NAME: hs_usuarios
      PORT: '3004'
      JWT_SECRET: ${STACK_JWT_SECRET:?Genera primero stack.env}
      SERVICE_NAME: usuarios
      USUARIOS_SERVICE_URL: http://usuarios-service:3004
      INTERNAL_READERS: '{}'
    ports:
    - 127.0.0.1:3004:3004
    depends_on:
      mysql-stack:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3004/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
  asistente-service:
    build:
      context: ./backend/asistente-service
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql-stack
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      DB_NAME: hs_asistente
      PORT: '3005'
      SERVICE_NAME: asistente
      USUARIOS_SERVICE_URL: http://usuarios-service:3004
      INTERNAL_READERS: '{}'
    ports:
    - 127.0.0.1:3005:3005
    depends_on:
      mysql-stack:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3005/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
  huespedes-service:
    build:
      context: ./backend/huespedes-service
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql-stack
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      DB_NAME: hs_huespedes
      PORT: '3003'
      SERVICE_NAME: huespedes
      USUARIOS_SERVICE_URL: http://usuarios-service:3004
      INTERNAL_READERS: '{"reservas": "${RESERVAS_INTERNAL_TOKEN:?Genera seguridad.env}",
        "cobros": "${COBROS_INTERNAL_TOKEN:?Genera seguridad.env}"}'
    ports:
    - 127.0.0.1:3003:3003
    depends_on:
      mysql-stack:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3003/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
  cobros-service:
    build:
      context: ./backend/cobros-service
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    env_file:
      - ./pagos.env
    environment:
      DB_HOST: mysql-stack
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Genera primero stack.env}
      DB_NAME: hs_cobros
      PORT: '3006'
      RESERVAS_SERVICE_URL: http://reservas-service:3001
      HUESPEDES_SERVICE_URL: http://huespedes-service:3003
      SERVICE_NAME: cobros
      USUARIOS_SERVICE_URL: http://usuarios-service:3004
      INTERNAL_READERS: '{"reservas": "${RESERVAS_INTERNAL_TOKEN:?Genera seguridad.env}"}'
      INTERNAL_SERVICE_NAME: cobros
      INTERNAL_SERVICE_TOKEN: ${COBROS_INTERNAL_TOKEN:?Genera seguridad.env}
    ports:
    - 127.0.0.1:3006:3006
    depends_on:
      mysql-stack:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3006/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
volumes:
  stack_mysql_data: {}
